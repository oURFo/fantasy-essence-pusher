<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/"><title>雷神彈珠與階段雷電演出驗證</title><style>*{box-sizing:border-box}body{margin:0;background:#0c1015;color:#f7e6c6;font:15px 'Microsoft JhengHei',sans-serif}header{padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,select{font:inherit;padding:8px;background:#29232a;color:#ffe7bd;border:1px solid #a28149;border-radius:5px}main{max-width:380px;margin:auto}canvas{width:100%;display:block}p{padding:0 12px;margin:6px 0}</style>
<header><label>品質 <select id="tier"><option value="0">銅級</option><option value="3">銀級</option><option value="6">金級</option><option value="10">雷神級</option></select></label><button id="idle">待機</button><label>力道 <select id="launch-force"><option value=".32">32%</option><option value=".4">40%</option><option value=".65" selected>65%</option><option value="1">100%</option></select></label><button id="ball">播放彈珠</button><button id="rail-turn">弧軌轉彎</button><label>雷電格 <select id="charge"><option>1</option><option>3</option><option>4</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select></label><button id="feed">播放充能</button><button id="charge-still">充能定格</button><button id="strike">落鎚瞬間</button><button id="rolling">獎金滾動</button><button id="reward">神器出爐</button><button id="animate">播放完整鍛造</button></header><p id="note">載入專用機台素材…</p><main><canvas id="game" width="1024" height="1536"></canvas></main>
<script type="module">
import {ThunderForge} from '/src/forge-game.ts';import {PlayerWallet} from '/src/wallet.ts';import {loadForgeArtwork,renderForge} from '/src/forge-rendering.ts';
await loadForgeArtwork();let game,playing=false;const $=id=>document.getElementById(id);
function make(kind,time=0,animate=false){let n=0;game=new ThunderForge(new PlayerWallet(),()=>n++===0?(kind==='energy'?.8:.95):.9999);game.setPower(Number(document.getElementById('launch-force').value));game.energy=kind==='energy'?Number($('charge').value)-1:Number($('tier').value);if(kind!=='idle'){game.drop();game.time=time<0?0:game.arrival+(kind==='forge'?(game.result?.full?game.chargeDuration:.55):0)+time;if(kind==='forge'&&time>=0)game.phase='forging';}playing=animate;renderForge(game);$('note').textContent=kind==='energy'?`測試：點亮第 ${game.result.energyAfter} 格雷電`:`測試：${$('tier').selectedOptions[0].textContent} · ${kind}（獨立測試錢包）`;}
$('idle').onclick=()=>make('idle');$('ball').onclick=()=>make('forge',-1,true);$('rail-turn').onclick=()=>{make('forge',-1);game.time=game.path.railPoints.find(p=>p.x<880&&p.y<350).t;playing=false;renderForge(game);};$('feed').onclick=()=>make('energy',0,true);$('charge-still').onclick=()=>make('energy',.9);$('strike').onclick=()=>make('forge',1.41);$('rolling').onclick=()=>{make('forge',0);game.time=game.arrival+(game.result.full?game.chargeDuration:.55)+game.revealAt-.3;renderForge(game);};$('reward').onclick=()=>{make('forge',0);game.time=game.arrival+(game.result.full?game.chargeDuration:.55)+game.revealAt+.25;renderForge(game);};$('tier').onchange=()=>make('idle');$('animate').onclick=()=>make('forge',0,true);let last=0,acc=0;function frame(ms){acc+=Math.min((ms-last)/1000,.1);last=ms;if(playing){while(acc>=1/60){game.step();acc-=1/60;}renderForge(game);if(game.phase==='idle')playing=false;}else acc=0;requestAnimationFrame(frame);}make('idle');requestAnimationFrame(frame);
</script></html>
