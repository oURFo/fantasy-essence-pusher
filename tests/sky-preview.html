<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><base href="/"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sky Wings render QA</title><style>body{margin:0;background:#0c1b22;color:white;font-family:sans-serif}nav{position:sticky;top:0;display:flex;gap:10px;padding:12px;background:#112d34;z-index:2}button{padding:12px}canvas{display:block;width:min(600px,100%);height:auto;margin:auto}</style><nav><button id="base">基本型態</button><button id="azure">青藍型態</button><button id="gold">金色型態</button><button id="upgrade">升階十秒</button><button id="drain">返航結算測試</button><button id="fall">落珠測試</button><button id="normal">一般得獎</button><button id="jackpot">1000 得獎</button></nav><canvas id="game" width="1024" height="1536"></canvas><script type="module">
import R from '@dimforge/rapier3d-compat';import {SkyWings} from '/src/sky-game.ts';import {loadSkyArtwork,renderSky} from '/src/sky-rendering.ts';
await R.init();await loadSkyArtwork();const g=new SkyWings(undefined,()=>0);let previous=0,acc=0;function frame(ms){if(!previous)previous=ms;acc+=Math.min(.1,(ms-previous)/1000);previous=ms;while(acc>=1/60){g.step();acc-=1/60;}renderSky(g);requestAnimationFrame(frame);}requestAnimationFrame(frame);
function tier(n){g.sky.reset();g.sky.tier=n;g.sky.remaining=[0,300,100][n];}
document.querySelector('#base').onclick=()=>tier(0);document.querySelector('#azure').onclick=()=>tier(1);document.querySelector('#gold').onclick=()=>tier(2);
document.querySelector('#fall').onclick=()=>{g.coins.slice(0,3).forEach((c,i)=>{c.entered=true;c.slotChecked=true;c.exitZone=null;c.body.setTranslation({x:[-2.3,0,2.3][i],y:-.45,z:7.2},true);c.body.setLinvel({x:0,y:-.6,z:0},true);});};
document.querySelector('#normal').onclick=()=>{tier(0);g.sky.phase='result';g.sky.spinTier=0;g.sky.prizeIndex=7;g.sky.angle=-7*Math.PI/4;g.sky.lastAmount=20;g.sky.resultAt=g.sky.clock;};
document.querySelector('#drain').onclick=()=>{tier(1);g.sky.remaining=.01;g.sky.trigger();g.sky.trigger();g.pendingBonuses=Array.from({length:30},()=>({kind:'green',due:g.time}));};
document.querySelector('#upgrade').onclick=()=>{tier(0);g.sky.phase='upgrading';};document.querySelector('#jackpot').onclick=()=>{tier(2);g.sky.phase='result';g.sky.spinTier=2;g.sky.prizeIndex=6;g.sky.angle=-6*Math.PI/4;g.sky.lastAmount=1000;g.sky.resultAt=g.sky.clock;};
</script></html>
