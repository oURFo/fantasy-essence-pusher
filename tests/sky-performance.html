<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><base href="/"><title>Sky Wings performance</title><style>body{background:#10252b;color:#fff;font:16px sans-serif}canvas{width:340px;float:right}button{padding:12px}pre{white-space:pre-wrap}</style><button id="run">測試目前版本</button><pre id="results">ready</pre><canvas id="game" width="1024" height="1536"></canvas><script type="module">
import R from '@dimforge/rapier3d-compat';import {SkyWings} from '/src/sky-game.ts';import {loadSkyArtwork,renderSky} from '/src/sky-rendering.ts';
await R.init();await loadSkyArtwork();const out=document.querySelector('#results');const raf=()=>new Promise(requestAnimationFrame),mean=a=>a.reduce((s,x)=>s+x,0)/a.length,p95=a=>[...a].sort((a,b)=>a-b)[Math.floor(a.length*.95)];
async function benchmark(){document.querySelectorAll('button').forEach(b=>b.disabled=true);out.textContent='running';try{const draw=renderSky;const results=[];
for(const [tier,count] of [[0,100],[1,300],[2,600]]){const g=new SkyWings(undefined,()=>0,()=>.5);g.sky.tier=tier;g.sky.remaining=10000;while(g.coins.length<count){const i=g.coins.length;g.makeCoin(-3.2+(i%12)*.54,.3+Math.floor(i/144)*.51,1.5+(Math.floor(i/12)%12)*.44,false,'green','bed');}const physics=[];for(let i=0;i<120;i++){const t=performance.now();g.step();physics.push(performance.now()-t);}const paint=[],interval=[];let last=await raf();for(let i=0;i<48;i++){const now=await raf();if(i>7)interval.push(now-last);last=now;const t=performance.now();draw(g);if(i>7)paint.push(performance.now()-t);}results.push({tier,count:g.coins.length,physicsMean:mean(physics),renderMean:mean(paint),renderP95:p95(paint),frameP95:p95(interval)});g.dispose();out.textContent=JSON.stringify({results},null,2);}
}catch(e){out.textContent=String(e);}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false);}}
document.querySelector('#run').onclick=()=>benchmark();
</script></html>
