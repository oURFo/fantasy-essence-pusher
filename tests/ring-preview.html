<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><base href="/"><title>夜市拾寶演出驗證</title><link rel="stylesheet" href="/src/style.css"><style>nav{position:sticky;top:0;z-index:9;background:#142620;padding:10px;display:flex;gap:10px}nav button{font-size:12px;padding:10px}#app{padding-top:10px}.ring-panel{align-self:start}</style><nav><button id="demo-buy">補充20圈</button><button id="demo-milk">示範套中牛奶</button><button id="demo-whisky">示範套中洋酒</button><button id="demo-leave">離場自動售出</button></nav><div id="app"><p id="qa-wallet" role="status"></p><main><section class="machine"><canvas id="game" width="1024" height="1536"></canvas><button id="ring-throw-zone" class="ring-throw-zone" aria-label="拖曳圈圈投出"></button></section><aside class="ring-panel"><h2>夜市拾寶 · 演出驗證</h2><div id="ring-shop" class="ring-shop"></div><p>剩餘 <strong id="ring-count"></strong> 個圈圈</p><p id="ring-message" role="status"></p><details open><summary>戰利品背包 <span id="ring-bag-total"></span></summary><div id="ring-bag-items"></div><button id="ring-sell-all">全部賣出換金幣</button></details><div id="ring-prices"></div></aside></main></div><script type="module">
