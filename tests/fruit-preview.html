<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><base href="/"><title>水果星宴演出 QA</title><style>body{margin:0;background:#1a1220;color:#fff;font:16px sans-serif}nav{position:sticky;top:0;z-index:2;background:#281e29;padding:10px;display:flex;gap:8px}button{padding:12px}canvas{display:block;width:min(640px,100%);margin:auto}</style><nav><button id="normal">一般遊玩</button><button id="weak">弱力發射</button><button id="strong">強力發射</button><button id="gift">五格贈禮</button><button id="partial">部分水果點亮</button><button id="result">一般結算</button><button id="pockets">留球與免費局</button><button id="free-result">免費局結算</button><button id="jackpot">高額獎結算</button></nav><canvas id="game" width="1024" height="1700"></canvas><script type="module">
import {FruitPinball,FruitProgress} from '/src/fruit-game.ts';import {PlayerWallet} from '/src/wallet.ts';import {loadFruitArtwork,renderFruit} from '/src/fruit-rendering.ts';import {completedRecipes} from '/src/fruit-rules.ts';
await loadFruitArtwork();let g=new FruitPinball(new PlayerWallet()),last=0,acc=0;function fresh(random=Math.random){g.dispose();g=new FruitPinball(new PlayerWallet(),new FruitProgress(),random);return g;}function frame(ms){if(!last)last=ms;acc+=Math.min(.1,(ms-last)/1000);last=ms;while(acc>=1/60){g.step();acc-=1/60;}renderFruit(g);requestAnimationFrame(frame);}requestAnimationFrame(frame);
document.querySelector('#normal').onclick=()=>fresh().start();document.querySelector('#weak').onclick=()=>g.launch(.15);document.querySelector('#strong').onclick=()=>g.launch(.9);document.querySelector('#gift').onclick=()=>{fresh(()=>.999);g.progress.streak=3;g.start();};document.querySelector('#partial').onclick=()=>{fresh().start();for(const i of [0,1,5,6,10])g.activate(i);};
document.querySelector('#pockets').onclick=()=>{fresh().start();g.launched=15;for(let i=0;i<6;i++)g.capture(0);for(let i=0;i<6;i++)g.capture(12);for(let i=0;i<3;i++)g.capture(15);};
document.querySelector('#free-result').onclick=()=>{g.launched=16;g.capture(15);};
function result(mask){fresh().start();for(let i=0;i<16;i++)if(mask&(1<<i))g.activate(i);g.launched=16;g.landed=16;g.step();}
document.querySelector('#jackpot').onclick=()=>result(65535);document.querySelector('#result').onclick=()=>{let mask=0;while(completedRecipes(mask).length!==3)mask++;result(mask);};
</script></html>
