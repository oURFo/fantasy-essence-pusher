<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><base href="/"><meta name="viewport" content="width=device-width,initial-scale=1"><title>金礦傳說演出驗證</title><link rel="stylesheet" href="/src/style.css"><style>nav{position:sticky;top:0;z-index:9;display:flex;gap:8px;background:#102923;padding:8px}nav button{padding:10px;font-size:13px}#app{padding-top:10px}#machine-screen{align-items:start}</style><nav><button id="qa-base">基本盤面</button><button id="qa-train">列車發車</button><button id="qa-gold">金礦時間</button><button id="qa-spin">快速SLOT</button><button id="qa-win">200珠大當り</button></nav><div id="app"><main id="machine-screen" data-machine="gold-mine"><section class="machine"><canvas id="game" width="1024" height="1536"></canvas><div id="mine-knob" class="mine-knob" role="slider" tabindex="0" aria-label="發射旋鈕" aria-valuemin="0" aria-valuemax="11" aria-valuenow="0"></div></section><aside class="mine-panel"><h2>金礦傳說</h2><p id="mine-stage"></p><label id="mine-dial-label" for="mine-dial">停止發射</label><input id="mine-dial" type="range" min="0" max="11" value="0"><div class="mine-controls"><button id="mine-left">左打</button><button id="mine-stop">停止</button><button id="mine-right">右打</button></div><div class="fate-score"><small>本機積分</small><strong id="mine-points">0</strong></div><button id="mine-redeem">兌換</button><p id="mine-queue"></p><p id="mine-message" role="status"></p><button id="mine-sound" aria-pressed="true">音效：開</button><div id="mine-paytable"></div></aside></main></div><script type="module">
import {GoldMine} from '/src/mine-game.ts';import {PlayerWallet} from '/src/wallet.ts';import {mineRewardBall} from '/src/mine-physics.ts';import {MINE_PORTS,MINE_SLOT_TIMING} from '/src/mine-rules.ts';import {loadMineArtwork,renderMine} from '/src/mine-rendering.ts';import {initMineUI} from '/src/mine-ui.ts';await loadMineArtwork();let unit=.5,g=new GoldMine(new PlayerWallet(),()=>unit),last=0,acc=0;const ui=initMineUI(()=>g,()=>false,()=>{});function reset(){g.dispose();unit=.5;g=new GoldMine(new PlayerWallet(),()=>unit);}function pocket(kind){const p=MINE_PORTS.find(p=>p.kind===kind),b=mineRewardBall(1,p.x,.5);b.y=p.y-1;b.vy=5;g.balls.push(b);g.step();}function ticks(n){for(let i=0;i<n;i++)g.step();}document.querySelector('#qa-base').onclick=()=>reset();document.querySelector('#qa-train').onclick=()=>{reset();unit=0;pocket('score');unit=.5;};document.querySelector('#qa-gold').onclick=()=>{reset();unit=0;pocket('score');ticks(181);unit=.5;g.setDial(16);};document.querySelector('#qa-spin').onclick=()=>{reset();unit=.13;pocket('slot');};document.querySelector('#qa-win').onclick=()=>{reset();unit=.1955;pocket('slot');ticks(Math.ceil(MINE_SLOT_TIMING.spin*60)+4);unit=.5;};function frame(ms){if(!last)last=ms;acc+=Math.min(.1,(ms-last)/1000);last=ms;while(acc>=1/60){g.step();acc-=1/60;}renderMine(g);ui.update(g);requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
