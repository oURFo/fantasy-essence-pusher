<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><base href="/"><meta name="viewport" content="width=device-width,initial-scale=1"><title>命運星軌演出驗證</title><link rel="stylesheet" href="/src/style.css"><style>nav{position:sticky;top:0;z-index:9;display:flex;gap:6px;background:#132939;padding:8px}nav button{padding:10px 5px;font-size:12px}#app{padding-top:12px}#machine-screen{display:grid;align-items:start}</style><nav><button id="demo-shot">一般射球</button><button id="demo-portal">命運入口演出</button><button id="demo-jackpot">四紅大獎演出</button><button id="demo-second">第二層白洞</button><button id="demo-multi">三層多球</button><button id="demo-burst">連發測試</button><button id="demo-ceiling">天花板接觸</button><button id="demo-points">29分兌換示範</button></nav><div id="app"><p id="qa-wallet" role="status"></p><main id="machine-screen" data-machine="fate-orbit"><section class="machine"><canvas id="game" width="1024" height="1536"></canvas><button id="fate-aim-zone" class="fate-aim-zone" aria-label="拖曳大砲調整角度後按發射"></button><button id="fate-cannon-fire" class="fate-cannon-fire">發射</button></section><aside class="fate-panel"><div class="fate-controls"><button id="fate-left">◀</button><button id="fate-fire">射出星珠 · 3金幣</button><button id="fate-right">▶</button></div><div class="fate-score"><div><small>本機積分</small><strong id="fate-points">0</strong></div><div><small>可兌換金幣</small><strong id="fate-exchange">0</strong></div></div><button id="fate-redeem">兌換金幣</button><p id="fate-tail" class="hint"></p><p id="fate-message" role="status"></p><div class="fate-disc-heading"><h2>四層命運盤</h2><p id="fate-phase"></p></div><canvas id="fate-disc-canvas" width="620" height="980" aria-label="四層星盤物理演出"></canvas><button id="fate-return-board">返回射球區</button><button id="fate-sound" aria-pressed="true">音效：開</button><div id="fate-paytable"></div></aside></main></div><script type="module">
import {FateOrbit} from '/src/fate-game.ts';import {enterFateDisc} from '/src/fate-physics.ts';import {PlayerWallet} from '/src/wallet.ts';import {loadFateArtwork,renderFate} from '/src/fate-rendering.ts';import {initFateUI} from '/src/fate-ui.ts';import {bindFateInput} from '/src/fate-input.ts';
await loadFateArtwork();let g=new FateOrbit(new PlayerWallet()),last=0,acc=0,burst=0;const ui=initFateUI(()=>g,()=>false,()=>{});bindFateInput(()=>g,()=>false,()=>{},ui.unlock);function frame(ms){if(!last)last=ms;acc+=Math.min(.1,(ms-last)/1000);last=ms;while(acc>=1/60){if(burst&&g.canShoot&&g.shoot())burst--;g.step();acc-=1/60;}renderFate(g);ui.update(g);document.querySelector('#qa-wallet').textContent=`共用金幣 ${g.gold} · 機台積分 ${g.points}`;requestAnimationFrame(frame);}requestAnimationFrame(frame);
function fresh(values=[]){burst=0;g.dispose();g=new FateOrbit(new PlayerWallet(),()=>values.shift()??.5);g.time=.5;}
function portal(values){fresh(values);g.shoot();Object.assign(g.ball,{x:0,y:9.99,vx:0,vy:3});g.step();g.step();ui.unlock();}
document.querySelector('#demo-multi').onclick=()=>{fresh();for(let level=0;level<3;level++){g.time+=1;g.shoot();const r=g.latestShot;r.phase='disc';r.phaseAt=g.time;r.ball=null;r.level=level;r.disc=enterFateDisc(level,.5,g.plateAngles[level]);}ui.unlock();};document.querySelector('#demo-burst').onclick=()=>{fresh();burst=12;ui.unlock();};document.querySelector('#demo-ceiling').onclick=()=>{fresh([.26725,.5]);g.shoot();Object.assign(g.ball,{x:0,y:10.6,vx:0,vy:3});ui.unlock();};document.querySelector('#demo-shot').onclick=()=>{fresh();ui.unlock();g.shoot();};document.querySelector('#demo-portal').onclick=()=>portal([.26725,.5]);document.querySelector('#demo-jackpot').onclick=()=>portal([.12075,.15725,.17925,.19425]);document.querySelector('#demo-second').onclick=()=>portal([.12075,.26725,.5]);document.querySelector('#demo-points').onclick=()=>{fresh();g.points=29;};
</script></html>
