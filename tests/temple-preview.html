<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><base href="/"><meta name="viewport" content="width=device-width,initial-scale=1"><title>土地公演出驗證</title><style>body{margin:0;background:#151311;color:#ffe1a3;font-family:sans-serif}nav{position:fixed;top:0;left:0;z-index:2;display:flex;gap:6px;flex-wrap:wrap}button{padding:10px;background:#642d18;color:#fff1c4;border:1px solid #e1ad60}canvas{display:block;height:100vh;width:auto;max-width:100%;margin:auto;object-fit:contain}</style><nav><button id="base">一般</button><button id="first">初一</button><button id="small">十五</button><button id="medium">中秋</button><button id="opening">開廟</button><button id="bonus">賜福</button><button id="closing">關廟</button></nav><canvas id="game" width="1024" height="1536"></canvas><script type="module">import {TempleFortune} from '../src/temple-game.ts';import {PlayerWallet} from '../src/wallet.ts';import {loadTempleArtwork,renderTemple} from '../src/temple-rendering.ts';let unit=.5,g;await loadTempleArtwork();function reset(){g=new TempleFortune(new PlayerWallet(),()=>unit);}reset();for(const id of ['base','first','small','medium','opening','bonus','closing'])document.getElementById(id).onclick=()=>{unit=id==='first'?.1:id==='small'?.2:id==='medium'?.03:.005;reset();if(id!=='base'){g.slotQueue=1;while(g.phase!=='opening'&&g.slotPhase!=='result')g.step();if(id==='opening'||id==='bonus'||id==='closing'){while(g.phase!=='opening')g.step();if(id!=='opening'){while(g.phase!=='bonus')g.step();if(id==='closing'){g.phase='closing';g.phaseAt=g.time;}}}}};let last=0,acc=0;function frame(t){acc+=Math.min((t-(last||t))/1000,.1);last=t;while(acc>=1/60){g.step();acc-=1/60;}renderTemple(g);requestAnimationFrame(frame)}requestAnimationFrame(frame);</script></html>
