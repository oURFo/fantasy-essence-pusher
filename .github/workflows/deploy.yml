name: Deploy game to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node tests/player-controls.mjs
      - run: node tests/initial-layout.mjs
      - run: node tests/wallet-auto.mjs
      - run: node tests/essence-return.mjs
      - run: node tests/lobby-session.mjs
      - run: node tests/mine-game.mjs
      - run: node tests/mine-ui.mjs
      - run: node tests/fate-game.mjs
      - run: node tests/fate-multiball.mjs
      - run: node tests/fate-ui.mjs
      - run: node tests/fate-input.mjs
      - run: node tests/fate-balance.mjs
      - run: node tests/fate-layout.mjs
      - run: node tests/gm-controls.mjs
      - run: node tests/ring-game.mjs
      - run: node tests/ring-input.mjs
      - run: node tests/ring-economy.mjs
      - run: node tests/fruit-rules.mjs
      - run: node tests/fruit-paths.mjs
      - run: node tests/fruit-game.mjs
      - run: node tests/fruit-touch-input.mjs
      - run: node tests/fruit-economy.mjs
      - run: node tests/sky-wings.mjs
      - run: node tests/sky-return-gold.mjs
      - run: node tests/sky-transition.mjs
      - run: node tests/sky-front-layout.mjs
      - run: node tests/sky-draw-order.mjs
      - run: node tests/sky-physics.mjs
      - run: node tests/sky-balance.mjs
      - run: node tests/slot.mjs
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
