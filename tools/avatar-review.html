<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>共用角色三視圖檢查</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f0e8;color:#51495b;font:14px system-ui}main{max-width:850px;margin:auto;padding:22px}h1{font-size:24px;margin:0 0 7px}p{margin:0 0 14px}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}button,select{border:1px solid #cecbc1;border-radius:9px;background:white;padding:8px 14px;color:inherit}#cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}section{background:#fffdf8;border:1px solid #e2dbd0;border-radius:18px;padding:12px;text-align:center}h2{font-size:16px;margin:2px}canvas{display:block;width:100%;height:auto}.views{display:flex;justify-content:space-around;font-size:12px;color:#847d8b}@media(max-width:650px){#cards{grid-template-columns:1fr}}</style>
<main><h1>共用素體・三視圖</h1><p>完整輪廓、短頸與短腿比例；所有套裝共用同一個頭部。</p><header><button id="walk">預覽行走</button><label>配飾 <select id="accessory"><option value="none">不戴配飾</option value="cap">棒球帽</option><option value="cat">貓耳髮箍</option><option value="crown">皇冠</option><option value="star">星星髮夾</option></select></label><label>影格 <select id="phase"><option value="auto">自動</option><option value="0">接觸一</option><option value="1">通過一</option><option value="2">接觸二</option><option value="3">通過二</option></select></label></header><div id="cards"></div></main>
<script type="module">
import {prepareRigArtwork,drawRigAvatar,RIG_ASSETS} from '../src/avatar-rendering.ts';
import {defaultLook} from '../src/wardrobe.ts';
const images=await Promise.all(RIG_ASSETS.map(name=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src='/assets/lobby/'+(name==='expressions'?'rig-v2/':'rig-v3/')+name+'.png';})));
const art=prepareRigArtwork(images),cards=[];let walking=false,accessory='none',phase='auto';
for(const [name,suit,hair] of [['標準素體','base','short'],['遊樂場套裝','arcade','short'],['晴日丹寧套裝','denim','bob'],['珊瑚冒險套裝','rose','ponytail']]){const section=document.createElement('section'),h=document.createElement('h2'),canvas=document.createElement('canvas');h.textContent=name;canvas.width=720;canvas.height=410;canvas.setAttribute('aria-label',name+'正面、右側、背面');section.append(h,canvas);const views=document.createElement('div');views.className='views';views.innerHTML='<span>正面</span><span>右側</span><span>背面</span>';section.append(views);document.querySelector('#cards').append(section);cards.push({canvas,suit,hair});}
document.querySelector('#walk').onclick=()=>{walking=!walking;document.querySelector('#walk').textContent=walking?'切回站姿':'預覽行走';};document.querySelector('#accessory').onchange=e=>accessory=e.target.value;
document.querySelector('#phase').onchange=e=>phase=e.target.value;
function frame(t){for(const c of cards){const ctx=c.canvas.getContext('2d');ctx.clearRect(0,0,720,410);ctx.save();ctx.scale(2,2);for(let i=0;i<3;i++){ctx.save();ctx.translate(60+i*120,185);ctx.scale(1.1,1.1);drawRigAvatar(ctx,art,{...defaultLook(),suit:c.suit,hairStyle:c.hair,accessory},['down','right','up'][i],walking||phase!=='auto',phase==='auto'?t*.18:108*(Number(phase)+.1)/4,0,0,false,c.suit==='base');ctx.restore();}ctx.restore();}requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
