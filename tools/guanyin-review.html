<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><base href="/"><meta name="viewport" content="width=device-width,initial-scale=1"><title>觀音淨願 · 開發驗證</title><body><script type="module">
import '../src/style.css';import {GuanyinGrace} from '../src/guanyin-game.ts';import {PlayerWallet} from '../src/wallet.ts';import {guanyinSeed} from '../src/guanyin-rules.ts';import {loadGuanyinArtwork,renderGuanyin} from '../src/guanyin-rendering.ts';import {initGuanyinUI} from '../src/guanyin-ui.ts';import {initGameFullscreen} from '../src/fullscreen.ts';
const parsed=new DOMParser().parseFromString(await(await fetch('/index.html')).text(),'text/html');parsed.querySelectorAll('script').forEach(s=>s.remove());document.body.innerHTML=parsed.body.innerHTML;const el=id=>document.getElementById(id);el('lobby-screen').hidden=true;el('machine-screen').hidden=false;el('machine-screen').dataset.machine='guanyin-grace';el('lobby-wallet').hidden=true;el('machine-nav').hidden=false;el('page-title').textContent='觀音淨願';el('page-subtitle').textContent='開發驗證 · 獨立記憶體錢包';el('game').width=1024;el('game').height=1536;el('game').setAttribute('aria-label','觀音淨願：中央觀音坐蓮、淨瓶與五個OUT');el('machine-announcement').textContent='觀音淨願 · 淨瓶賜福';el('loading').style.display='none';document.querySelector('.play-controls').hidden=true;el('adventure-details').hidden=true;el('forge-cabinet-play').hidden=true;
for(const aside of document.querySelector('#machine-screen aside').children)aside.hidden=true;initGameFullscreen();let g;const ui=initGuanyinUI(()=>g,()=>false,()=>{ui.update(g);el('gold-balance').textContent=g.gold.toLocaleString();});ui.show(true);const select=document.createElement('select');select.setAttribute('aria-label','驗證場景');for(const [value,label] of [['base','一般盤面'],['willow','楊柳護佑'],['jackpot','淨瓶大獎'],['lotus','蓮花贈球']]){const o=document.createElement('option');o.value=value;o.textContent=label;select.append(o);}document.querySelector('.app-header').append(select);const play=document.createElement('input');play.type='checkbox';play.setAttribute('aria-label','播放模擬');document.querySelector('.app-header').append(play);
function scene(name){const w=new PlayerWallet();w.setBalance(1000);g=new GuanyinGrace(w,guanyinSeed(301));if(name!=='base'){const pick=name==='jackpot'?.001:name==='willow'?.03:.09;g.random=()=>pick;g.slotQueue=1;for(let i=0;i<(name==='willow'?125:100);i++)g.step();}ui.update(g);renderGuanyin(g);}await loadGuanyinArtwork();scene('base');select.onchange=()=>scene(select.value);let last=0,previous=0,acc=0;function frame(t){if(play.checked&&previous){acc+=Math.min(.05,(t-previous)/1000);while(acc>=1/60){g.step();acc-=1/60;}}previous=t;renderGuanyin(g);if(t-last>100){ui.update(g);last=t;}requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
